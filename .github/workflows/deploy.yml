name: payNEXT CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: paynext-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f docker-compose.yml
          test -f Caddyfile
          test -f client/Dockerfile
          test -f client/nginx.conf
          test -f client/public/index.html
          test -f db/init.sql

      - name: Create dummy .env file
        run: echo "JWT_SECRET=super_secret_test_key_at_least_32_chars" > .env

      - name: Validate Docker Compose file
        run: docker compose -f docker-compose.yml config > /dev/null

  test:
    name: API and E2E Tests
    runs-on: ubuntu-latest
    needs: validate
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: paynext_test
          POSTGRES_PASSWORD: paynext_test
          POSTGRES_DB: paynext_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paynext_test -d paynext_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Run unit and integration tests
        working-directory: server
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: paynext_test
          DB_PASSWORD: paynext_test
          DB_NAME: paynext_test
          JWT_SECRET: paynext-ci-test-secret-at-least-32-characters
          RATE_LIMIT_AUTH_MAX: 3
        run: npm run test:ci

      - name: Install Playwright browser
        working-directory: server
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke test
        working-directory: server
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: paynext_test
          DB_PASSWORD: paynext_test
          DB_NAME: paynext_test
          JWT_SECRET: paynext-ci-test-secret-at-least-32-characters
          RATE_LIMIT_AUTH_MAX: 100
        run: npm run test:e2e

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [validate, test]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
    env:
      SERVER_IP: ${{ secrets.SERVER_IP }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      DOMAIN: ${{ secrets.DOMAIN }}
      WWW_DOMAIN: ${{ secrets.WWW_DOMAIN }}
      ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts

      - name: Create deployment folder on server
        run: ssh "$SSH_USER@$SERVER_IP" "mkdir -p /opt/paynext"

      - name: Build server .env on the runner
        # NOTE: .env is NEVER included in the deploy tarball.
        # It is built here from GitHub Secrets and SCP'd directly to the server.
        run: |
          {
            echo "NODE_ENV=production"
            echo "PORT=3000"
            echo "DB_HOST=$DB_HOST"
            echo "DB_PORT=5432"
            echo "DB_USER=$DB_USER"
            echo "DB_PASSWORD=$DB_PASSWORD"
            echo "DB_NAME=$DB_NAME"
            echo "DB_SSL=true"
            echo "JWT_SECRET=$JWT_SECRET"
            echo "ALLOWED_ORIGINS=$ALLOWED_ORIGINS"
            echo "DOMAIN=$DOMAIN"
            echo "WWW_DOMAIN=$WWW_DOMAIN"
          } > server.env

      - name: Copy app and .env to server
        run: |
          # Caddyfile is included so the server has the templated config.
          # .env is NOT in the tarball — it is SCP'd separately as server.env -> .env
          tar --exclude='./.git' --exclude='./.github' --exclude='.env' --exclude='*/.env' --exclude='**/.env' --exclude='server/node_modules' --exclude='server/coverage' --exclude='server/test-results' --exclude='server/playwright-report' -czf paynext.tgz docker-compose.yml Caddyfile client server db
          scp paynext.tgz "$SSH_USER@$SERVER_IP":/tmp/paynext.tgz
          scp server.env "$SSH_USER@$SERVER_IP":/opt/paynext/.env
          ssh "$SSH_USER@$SERVER_IP" "chmod 600 /opt/paynext/.env"
          rm -f server.env paynext.tgz

      - name: Deploy using Docker
        run: |
          ssh "$SSH_USER@$SERVER_IP" << 'EOF'
          set -e
          cd /opt/paynext
          docker compose down --remove-orphans || true
          rm -rf client server db docker-compose.yml Caddyfile
          tar -xzf /tmp/paynext.tgz
          rm -f /tmp/paynext.tgz
          docker compose up -d --build
          docker compose exec -T caddy caddy validate --config /etc/caddy/Caddyfile
          docker image prune -f
          EOF

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "https://${DOMAIN}/api/v1/health"; then
              exit 0
            fi
            if [ "$attempt" -eq 30 ]; then exit 1; fi
            sleep 5
          done
