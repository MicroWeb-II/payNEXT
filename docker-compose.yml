services:
  web:
    build: ./web
    container_name: paynext-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  api:
    build: ./api
    container_name: paynext-api
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "3000"

  adminer:
    image: adminer
    container_name: paynext-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
