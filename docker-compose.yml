# payNEXT stack: Caddy (TLS, routing) -> web (nginx static) and api (Node) -> PostgreSQL.
#
# Images are referenced by an immutable tag (the Git SHA in CI/CD). For local
# development `IMAGE_TAG=local` (see .env.example) and `docker compose up --build`
# builds them from source. Deployments never use `latest`.
name: paynext

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  api:
    image: ${IMAGE_REGISTRY:-paynext}/paynext-api:${IMAGE_TAG:?IMAGE_TAG must be set (Git SHA or "local")}
    build: ./server
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DB_HOST: ${DB_HOST:-db}
      DB_SSL: ${DB_SSL:-false}
    stop_grace_period: 20s
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

  web:
    image: ${IMAGE_REGISTRY:-paynext}/paynext-web:${IMAGE_TAG:?IMAGE_TAG must be set (Git SHA or "local")}
    build: ./client
    restart: unless-stopped
    logging: *logging

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER must be set}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      POSTGRES_DB: ${DB_NAME:?DB_NAME must be set}
    # Continuous WAL archiving for point-in-time recovery (see docs/runbooks).
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=900
      - -c
      - archive_command=/usr/local/bin/archive-wal.sh %p %f
      - -c
      - max_wal_senders=3
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ${BACKUP_DIR:-./backups}:/backups
      - ./ops/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./ops/postgres/archive-wal.sh:/usr/local/bin/archive-wal.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    stop_grace_period: 30s
    logging: *logging

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/ops/backup/backup-cron.sh"]
    environment:
      PGHOST: db
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: ${DB_NAME}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 2 * * *}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - ./ops/backup:/ops/backup:ro
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN must be set}
      WWW_DOMAIN: ${WWW_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
    logging: *logging

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
