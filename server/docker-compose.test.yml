services:
  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: paynext_test
      POSTGRES_PASSWORD: paynext_test
      POSTGRES_DB: paynext_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paynext_test -d paynext_test"]
      interval: 2s
      timeout: 3s
      retries: 20